<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CleanHub - 안드로이드 전용 플레이어</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#09090b">
  <link rel="manifest" href="./manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", Roboto, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(2rem + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen select-none">

  <!-- 상단 헤더 -->
  <header class="bg-zinc-900/95 backdrop-blur border-b border-zinc-800 sticky top-0 z-30 px-4 py-3">
    <div class="max-w-lg mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="bg-amber-500 text-black font-black text-xs px-2 py-1 rounded-md">PLAY</span>
        <h1 class="font-extrabold text-base text-white">CleanHub</h1>
      </div>
      <button onclick="openSettings()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-lg font-bold">
        ⚙️ 서버 설정
      </button>
    </div>
  </header>

  <main class="max-w-lg mx-auto p-4 space-y-4">

    <!-- Worker 미설정 안내 배너 -->
    <div id="setup-banner" class="hidden bg-amber-500/15 border border-amber-500/40 rounded-2xl p-4 text-xs text-amber-200 space-y-2">
      <p class="font-extrabold text-sm">⚙️ 먼저 Cloudflare Worker 주소를 연결해 주세요</p>
      <p class="text-amber-200/80 leading-relaxed">우측 상단 <b>[⚙️ 서버 설정]</b>을 눌러 배포한 <code>https://...workers.dev</code> 주소를 입력하면 우회 앱 없이 바로 작동합니다.</p>
      <button onclick="openSettings()" class="bg-amber-500 text-black font-extrabold px-3 py-2 rounded-xl">지금 주소 입력하기</button>
    </div>

    <!-- 검색 & URL 직접 입력 -->
    <form onsubmit="handleSearch(event)" class="flex space-x-2">
      <input
        type="text"
        id="search-input"
        placeholder="검색어 또는 영상 URL 붙여넣기..."
        class="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-500 focus:ring-2 focus:ring-amber-500 outline-none"
      >
      <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-4 rounded-xl text-xs shrink-0">
        검색
      </button>
    </form>

    <!-- 광고 없는 전용 플레이어 -->
    <section id="player-box" class="hidden bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-2xl">
      <div class="w-full aspect-video bg-black relative">
        <video id="video-el" class="w-full h-full" controls playsinline></video>
      </div>
      <div class="p-3.5 space-y-3">
        <div class="flex items-start justify-between gap-2">
          <h2 id="player-title" class="text-sm font-bold text-white leading-snug line-clamp-2">영상 제목</h2>
          <button onclick="closePlayer()" class="text-zinc-400 hover:text-white text-lg px-1">✕</button>
        </div>

        <div class="flex items-center space-x-2">
          <select id="quality-select" onchange="switchQuality(this.value)" class="flex-1 bg-zinc-800 border border-zinc-700 text-zinc-100 text-xs font-bold rounded-xl px-3 py-2.5 outline-none"></select>
          <select onchange="document.getElementById('video-el').playbackRate = parseFloat(this.value)" class="bg-zinc-800 border border-zinc-700 text-zinc-100 text-xs font-bold rounded-xl px-2.5 py-2.5 outline-none">
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </div>

        <button onclick="downloadCurrent()" id="dl-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white py-2.5 rounded-xl font-extrabold text-xs transition">
          📥 현재 화질 동영상 다운로드
        </button>

        <!-- HLS 병합 다운로드 진행률 -->
        <div id="dl-progress-wrap" class="hidden space-y-1">
          <div class="flex justify-between text-[11px] text-zinc-400">
            <span id="dl-progress-label">스트림 병합 중...</span>
            <span id="dl-progress-pct" class="font-bold text-emerald-400">0%</span>
          </div>
          <div class="w-full h-2 bg-zinc-800 rounded-full overflow-hidden">
            <div id="dl-progress-bar" class="h-full bg-emerald-500 transition-all" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 로딩 표시 -->
    <div id="loading-el" class="hidden py-10 text-center space-y-2">
      <div class="inline-block w-6 h-6 border-2 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
      <p id="loading-msg" class="text-xs text-zinc-400">해외 중계 서버에서 불러오는 중...</p>
    </div>

    <!-- 영상 목록 그리드 -->
    <section class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h2 id="list-heading" class="text-xs font-extrabold text-amber-400">🔥 인기 동영상</h2>
        <div class="flex items-center space-x-1.5">
          <button onclick="changePage(-1)" class="bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-lg text-xs font-bold text-zinc-300">◀</button>
          <span id="page-num" class="text-xs font-bold text-zinc-400 px-1">1P</span>
          <button onclick="changePage(1)" class="bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-lg text-xs font-bold text-zinc-300">▶</button>
        </div>
      </div>
      <div id="video-grid" class="grid grid-cols-2 gap-3"></div>
    </section>

  </main>

  <!-- Worker URL 설정 모달 -->
  <div id="settings-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-sm p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
        <h3 class="font-extrabold text-sm text-white">⚙️ Cloudflare Worker 서버 주소</h3>
        <button onclick="closeSettings()" class="text-zinc-400 text-lg">✕</button>
      </div>
      <div class="space-y-2 text-xs">
        <label class="block text-zinc-400 font-bold">배포한 Worker 주소 (끝에 / 제외)</label>
        <input type="url" id="worker-url-input" placeholder="https://purple-paper-xxxx.workers.dev" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2.5 text-white outline-none">
      </div>
      <button onclick="saveSettings()" class="w-full bg-amber-500 text-black font-extrabold py-2.5 rounded-xl text-xs">저장 후 불러오기</button>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-amber-500 text-black text-xs font-extrabold px-4 py-2 rounded-full shadow-lg hidden z-50"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    let workerUrl = localStorage.getItem('cleanhub_worker_url') || '';
    let currentQuery = '';
    let currentPage = 1;
    let hls = null;
    let currentStreams = [];
    let currentVideoTitle = '';
    let isDownloading = false;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2400);
    }

    function openSettings() {
      document.getElementById('worker-url-input').value = workerUrl;
      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function saveSettings() {
      const val = document.getElementById('worker-url-input').value.trim().replace(/\/$/, '');
      if (!val.startsWith('http')) {
        showToast('https:// 로 시작하는 정확한 주소를 입력해 주세요.');
        return;
      }
      workerUrl = val;
      localStorage.setItem('cleanhub_worker_url', workerUrl);
      closeSettings();
      document.getElementById('setup-banner').classList.add('hidden');
      loadList();
    }

    function proxyUrl(target, extra = '') {
      return `${workerUrl}/api/proxy?url=${encodeURIComponent(target)}${extra}`;
    }

    async function loadList() {
      if (!workerUrl) {
        document.getElementById('setup-banner').classList.remove('hidden');
        return;
      }
      const loading = document.getElementById('loading-el');
      const grid = document.getElementById('video-grid');
      loading.classList.remove('hidden');
      document.getElementById('loading-msg').textContent = '목록을 불러오는 중...';
      document.getElementById('page-num').textContent = `${currentPage}P`;
      document.getElementById('list-heading').textContent = currentQuery ? `🔎 "${currentQuery}" 검색 결과` : '🔥 인기 동영상';

      try {
        const res = await fetch(`${workerUrl}/api/list?q=${encodeURIComponent(currentQuery)}&page=${currentPage}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        if (!data.items || data.items.length === 0) {
          grid.innerHTML = `<div class="col-span-2 text-center text-xs text-zinc-500 py-8">표시할 영상이 없습니다.</div>`;
        } else {
          grid.innerHTML = data.items.map(item => `
            <div onclick="openVideo('${item.vkey}')" class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden cursor-pointer active:scale-[0.98] transition">
              <div class="relative aspect-video bg-zinc-950">
                <img src="${proxyUrl(item.thumb)}" loading="lazy" class="w-full h-full object-cover">
                ${item.duration ? `<span class="absolute bottom-1 right-1 bg-black/80 text-[10px] font-bold text-white px-1.5 py-0.5 rounded">${item.duration}</span>` : ''}
              </div>
              <div class="p-2">
                <p class="text-xs font-bold text-zinc-200 line-clamp-2 leading-snug">${item.title}</p>
              </div>
            </div>
          `).join('');
        }
      } catch (e) {
        grid.innerHTML = `<div class="col-span-2 bg-rose-950/60 border border-rose-800 rounded-xl p-4 text-xs text-rose-200">불러오기 실패: ${e.message}</div>`;
      } finally {
        loading.classList.add('hidden');
      }
    }

    function handleSearch(e) {
      e.preventDefault();
      const val = document.getElementById('search-input').value.trim();
      if (/viewkey=([a-zA-Z0-9_-]+)/i.test(val)) {
        const vkey = val.match(/viewkey=([a-zA-Z0-9_-]+)/i)[1];
        openVideo(vkey);
        return;
      }
      currentQuery = val;
      currentPage = 1;
      loadList();
    }

    function changePage(delta) {
      currentPage = Math.max(1, currentPage + delta);
      loadList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function openVideo(vkey) {
      if (!workerUrl) { openSettings(); return; }
      const loading = document.getElementById('loading-el');
      loading.classList.remove('hidden');
      document.getElementById('loading-msg').textContent = '광고 제거 및 고화질 스트림 추출 중...';

      try {
        const res = await fetch(`${workerUrl}/api/extract?vkey=${encodeURIComponent(vkey)}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        if (!data.streams || data.streams.length === 0) throw new Error('재생 가능한 스트림이 없습니다.');

        currentStreams = data.streams;
        currentVideoTitle = data.title;

        document.getElementById('player-title').textContent = data.title;
        const sel = document.getElementById('quality-select');
        sel.innerHTML = currentStreams.map((s, idx) =>
          `<option value="${idx}">${s.quality}p (${s.format.toUpperCase()})</option>`
        ).join('');

        document.getElementById('player-box').classList.remove('hidden');
        switchQuality(0);
        document.getElementById('player-box').scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (e) {
        showToast(`추출 실패: ${e.message}`);
      } finally {
        loading.classList.add('hidden');
      }
    }

    function switchQuality(idx) {
      const stream = currentStreams[parseInt(idx, 10)];
      if (!stream) return;
      const video = document.getElementById('video-el');
      const currentTime = video.currentTime || 0;

      if (hls) { hls.destroy(); hls = null; }
      const proxied = proxyUrl(stream.url);

      if (stream.format === 'hls' || stream.url.includes('.m3u8')) {
        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(proxied);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            if (currentTime > 1) video.currentTime = currentTime;
            video.play().catch(() => {});
          });
        } else {
          video.src = proxied;
          video.play().catch(() => {});
        }
      } else {
        video.src = proxied;
        video.onloadedmetadata = () => {
          if (currentTime > 1) video.currentTime = currentTime;
          video.play().catch(() => {});
        };
      }
    }

    function closePlayer() {
      const video = document.getElementById('video-el');
      video.pause();
      video.src = '';
      if (hls) { hls.destroy(); hls = null; }
      document.getElementById('player-box').classList.add('hidden');
    }

    async function downloadCurrent() {
      if (isDownloading || currentStreams.length === 0) return;
      const idx = parseInt(document.getElementById('quality-select').value, 10);
      const stream = currentStreams[idx];
      if (!stream) return;

      if (stream.format === 'mp4' && !stream.url.includes('.m3u8')) {
        const dlUrl = proxyUrl(stream.url, `&dl=1&name=${encodeURIComponent(currentVideoTitle.slice(0, 40))}`);
        const a = document.createElement('a');
        a.href = dlUrl;
        a.download = `${currentVideoTitle.slice(0, 40)}.mp4`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast('안드로이드 다운로드를 시작했습니다!');
        return;
      }

      isDownloading = true;
      const wrap = document.getElementById('dl-progress-wrap');
      const bar = document.getElementById('dl-progress-bar');
      const pctEl = document.getElementById('dl-progress-pct');
      const labelEl = document.getElementById('dl-progress-label');
      wrap.classList.remove('hidden');

      try {
        labelEl.textContent = '재생목록 분석 중...';
        let m3u8Url = proxyUrl(stream.url);
        let text = await fetch(m3u8Url).then(r => r.text());

        if (text.includes('#EXT-X-STREAM-INF')) {
          const nextLine = text.split(/\r?\n/).find(l => l.trim() && !l.startsWith('#'));
          if (nextLine) {
            text = await fetch(nextLine.trim()).then(r => r.text());
          }
        }

        const segs = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
        if (segs.length === 0) throw new Error('영상 조각을 찾지 못했습니다.');

        const chunks = new Array(segs.length);
        let done = 0;
        for (let i = 0; i < segs.length; i += 4) {
          const batch = segs.slice(i, i + 4);
          await Promise.all(batch.map(async (u, j) => {
            const res = await fetch(u);
            chunks[i + j] = await res.arrayBuffer();
            done++;
            const pct = Math.round((done / segs.length) * 100);
            bar.style.width = `${pct}%`;
            pctEl.textContent = `${pct}%`;
            labelEl.textContent = `조각 저장 중 (${done} / ${segs.length})`;
          }));
        }

        const blob = new Blob(chunks, { type: 'video/mp2t' });
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `${currentVideoTitle.slice(0, 40).replace(/[^\w가-힣.-]/g, '_')}.ts`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
        showToast('다운로드가 완료되었습니다!');
      } catch (e) {
        showToast(`다운로드 오류: ${e.message}`);
      } finally {
        isDownloading = false;
        setTimeout(() => wrap.classList.add('hidden'), 3000);
      }
    }

    if (workerUrl) loadList();
    else document.getElementById('setup-banner').classList.remove('hidden');
  </script>
</body>
</html>
